<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07150f">
  <title>WINDING 10K — Forest Duel</title>
  <style>
    *{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07150f;color:#fff;font-family:Inter,"Helvetica Neue",Arial,sans-serif;touch-action:none;user-select:none}
    #game{display:block;width:100%;height:100%}.hud{position:fixed;inset:0;pointer-events:none;padding:max(18px,env(safe-area-inset-top)) 18px max(18px,env(safe-area-inset-bottom));display:flex;flex-direction:column;justify-content:space-between}
    .top{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}.brand{font-size:11px;font-weight:900;letter-spacing:.22em;color:#d4ff3f;text-shadow:0 2px 10px #000}.counter{text-align:right}.distance{font-size:28px;font-weight:900;line-height:.9}.unit{font-size:10px;letter-spacing:.14em;color:#b4c0b9}.progress{height:3px;background:#ffffff28;margin-top:9px;width:122px}.progress i{display:block;height:100%;width:0;background:#d4ff3f;box-shadow:0 0 8px #d4ff3f}
    .bottom{display:flex;align-items:flex-end;justify-content:space-between}.speed strong{font-size:46px;line-height:.8;font-style:italic}.speed span{display:block;font-size:10px;letter-spacing:.18em;margin-top:8px;color:#c7d0ca}.place{font-weight:900;font-size:13px;letter-spacing:.12em;border:1px solid #ffffff33;background:#06100ccc;padding:9px 12px;border-radius:99px}.place b{color:#d4ff3f}
    .message{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(#03100b66,#03100bdd);transition:.35s;z-index:3}.card{text-align:center;padding:28px;max-width:420px}.eyebrow{font-size:11px;letter-spacing:.28em;font-weight:900;color:#d4ff3f}.card h1{font-size:clamp(42px,13vw,78px);font-weight:1000;letter-spacing:-.075em;line-height:.82;margin:16px 0 20px;font-style:italic}.card h1 em{color:#d4ff3f;font-style:normal}.card p{font-size:14px;line-height:1.7;color:#d5ddd8;margin:0 auto 22px;max-width:340px}.start{pointer-events:auto;border:0;border-radius:99px;background:#d4ff3f;color:#10200f;padding:15px 30px;font:900 13px/1 inherit;letter-spacing:.16em;box-shadow:0 0 30px #bfff3850}.hint{display:block;margin-top:16px;font-size:10px;color:#8da096;letter-spacing:.1em}.hidden{opacity:0;pointer-events:none}.callout{position:fixed;top:22%;left:50%;transform:translate(-50%,-10px);opacity:0;font-weight:1000;font-style:italic;font-size:30px;letter-spacing:-.03em;text-shadow:0 4px 20px #000;transition:.2s;pointer-events:none}.callout.show{opacity:1;transform:translate(-50%,0)}
  </style>
</head>
<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="top"><div class="brand">WINDING 10K<br>FOREST DUEL</div><div class="counter"><div class="distance"><span id="km">0.00</span><small> / 10</small></div><div class="unit">KILOMETERS</div><div class="progress"><i id="bar"></i></div></div></div>
    <div class="bottom"><div class="speed"><strong id="speed">0</strong><span>KM/H</span></div><div class="place"><b id="place">2ND</b> POSITION</div></div>
  </div>
  <div id="message" class="message"><div class="card"><div class="eyebrow">ONE FINGER. TEN KILOMETERS.</div><h1>FOREST<br><em>DUEL</em></h1><p>指を左右に動かしてステアリング。狭くうねる道で、先行するライバルを追い抜け。</p><button id="start" class="start">START RACE</button><span class="hint">画面をタッチしたまま左右へ</span></div></div>
  <div id="callout" class="callout">1 KM</div>
  <script>
  (()=>{
    const c=document.querySelector('#game'),x=c.getContext('2d'); let W,H,D=1,last=0,running=false,t=0,dist=0,speed=0,nextSign=1,shake=0;
    const kmEl=document.querySelector('#km'),spEl=document.querySelector('#speed'),bar=document.querySelector('#bar'),placeEl=document.querySelector('#place'),msg=document.querySelector('#message'),callout=document.querySelector('#callout');
    let player={lane:0,vx:0,spin:0,wobble:0}, rival={lane:-.22,vx:0,lead:38,speed:164,wobble:0},target=0,particles=[];
    function resize(){D=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=W*D;c.height=H*D;x.setTransform(D,0,0,D,0,0)} addEventListener('resize',resize);resize();
    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
    function curve(s){return Math.sin(s*.0043)*.52+Math.sin(s*.0107+1.4)*.22+Math.sin(s*.0013+2)*.18}
    function widthAt(s){let pinch=(Math.sin(s*.0021)+Math.sin(s*.0067+2))*.5;return .60+pinch*.10-Math.max(0,Math.sin(s*.0011-1.7))*.13}
    function point(z){let s=dist*1000+z*3.5, p=z/H, horizon=H*.08, yy=H-(z), perspective=.32+.68*Math.pow(p,.72); return {y:yy,cx:W/2+curve(s)*W*.38*perspective,road:W*widthAt(s)*.48*perspective,p:perspective,s};}
    function input(e){if(!running)return;let q=e.touches?e.touches[0]:e;target=clamp((q.clientX/W-.5)*2,-1,1)}
    addEventListener('pointerdown',input);addEventListener('pointermove',e=>{if(e.buttons)input(e)});addEventListener('touchstart',input,{passive:false});addEventListener('touchmove',e=>{e.preventDefault();input(e)},{passive:false});
    function spark(px,py,n=8){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*170,vy:-Math.random()*130-30,life:.25+Math.random()*.35})}
    function reset(){t=dist=0;speed=0;nextSign=1;target=0;player={lane:0,vx:0,spin:0,wobble:0};rival={lane:-.18,vx:0,lead:42,speed:168,wobble:0};particles=[];running=true;msg.classList.add('hidden')}
    document.querySelector('#start').onclick=reset;
    function collide(dt){let edge=widthAt(dist*1000)*1.42; if(Math.abs(player.lane)>edge){let impact=Math.abs(player.vx)*85+Math.abs(target-player.lane)*35;if(impact<30){player.lane=Math.sign(player.lane)*edge;player.vx*=-.18;spark(W/2+player.lane*W*.25,H*.78,6)}else{player.lane=Math.sign(player.lane)*edge*.92;player.vx*=-.6;player.spin=Math.sign(player.vx||1)*Math.PI*4;player.wobble=2.1;speed*=.62;shake=.4;spark(W/2+player.lane*W*.25,H*.78,18)}}
      let gap=rival.lead,dx=player.lane-rival.lane;if(Math.abs(gap)<9&&Math.abs(dx)<.34&&player.wobble<=0&&rival.wobble<=0){let push=(speed-rival.speed)*.05;if(gap>0){speed=Math.max(100,speed-13);rival.lead+=7+Math.max(0,push)}else{speed+=10;player.wobble=1.4;rival.lead-=4}player.vx+=Math.sign(dx||1)*.35;rival.vx-=Math.sign(dx||1)*.25;player.wobble=1.4;rival.wobble=1.5;shake=.25}}
    function update(dt){if(!running)return;t+=dt;let desired=t<2?135:205;speed+=(desired-speed)*dt*.45;speed=clamp(speed,0,250);dist+=speed*dt/3600;
      let steer=player.wobble>0?Math.sin(t*17)*.22:target;player.vx+=(steer-player.lane)*dt*5.5;player.vx*=Math.pow(.12,dt);player.lane+=player.vx*dt*2.8; if(player.spin){player.spin*=Math.pow(.13,dt);if(Math.abs(player.spin)<.03)player.spin=0} player.wobble=Math.max(0,player.wobble-dt);
      let rubber=clamp((rival.lead-10)*-.18,-9,8),wave=Math.sin(t*.73)*7+Math.sin(t*.21)*5;rival.speed=clamp(speed+rubber+wave+(dist<.3?12:0),135,247);rival.lead+=(rival.speed-speed)*dt/3.6;rival.lead=clamp(rival.lead,-100,120);let ai=Math.sin(t*.65+1.1)*.42+Math.sin(t*.19)*.18;rival.vx+=(ai-rival.lane)*dt*2;rival.vx*=Math.pow(.2,dt);rival.lane+=rival.vx*dt;rival.wobble=Math.max(0,rival.wobble-dt);
      collide(dt);for(const p of particles){p.life-=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=380*dt}particles=particles.filter(p=>p.life>0);shake=Math.max(0,shake-dt);
      if(dist>=nextSign&&nextSign<=9){callout.textContent=nextSign+' KM';callout.classList.add('show');setTimeout(()=>callout.classList.remove('show'),900);nextSign++}
      if(dist>=10){dist=10;running=false;setTimeout(()=>{msg.classList.remove('hidden');msg.querySelector('.eyebrow').textContent=rival.lead<0?'VICTORY — 1ST PLACE':'FINISH — 2ND PLACE';msg.querySelector('h1').innerHTML=rival.lead<0?'YOU<br><em>WIN</em>':'NICE<br><em>CHASE</em>';msg.querySelector('p').textContent='10km完走。もう一度、最速のラインに挑戦しよう。';msg.querySelector('button').textContent='RACE AGAIN'},500)}
      kmEl.textContent=dist.toFixed(2);spEl.textContent=Math.round(speed);bar.style.width=(dist*10)+'%';placeEl.textContent=rival.lead<0?'1ST':'2ND';
    }
    function road(){x.fillStyle='#0b2417';x.fillRect(0,0,W,H);for(let y=0;y<H;y+=36){let q=point(H-y),q2=point(H-y+40);x.fillStyle=((y/36|0)%2)?'#10301e':'#0d291a';x.fillRect(0,y,W,40);x.fillStyle='#315340';x.beginPath();x.moveTo(q.cx-q.road-7*q.p,q.y);x.lineTo(q.cx+q.road+7*q.p,q.y);x.lineTo(q2.cx+q2.road+7*q2.p,q2.y);x.lineTo(q2.cx-q2.road-7*q2.p,q2.y);x.fill();x.fillStyle='#26302b';x.beginPath();x.moveTo(q.cx-q.road,q.y);x.lineTo(q.cx+q.road,q.y);x.lineTo(q2.cx+q2.road,q2.y);x.lineTo(q2.cx-q2.road,q2.y);x.fill();if((y/36|0)%2===0){x.fillStyle='#f5efe0';for(const side of[-1,1])x.fillRect(q.cx+side*q.road-side*4*q.p,q.y,4*q.p+1,40)}}
      for(let i=0;i<20;i++){let z=(i*83+(t*speed*1.8)%83)%H,q=point(z),side=i%2?1:-1,xx=q.cx+side*(q.road+20+((i*31)%45)*q.p);x.fillStyle=i%5===0?'#496b41':'#173d25';x.beginPath();x.arc(xx,q.y,5+17*q.p,0,7);x.fill();x.fillStyle='#132718';x.fillRect(xx-2*q.p,q.y,4*q.p,18*q.p)}
      if(nextSign<=10){let signZ=H-(((nextSign-dist)*1000/3.5)%H);if(signZ>30&&signZ<H){let q=point(signZ);x.save();x.translate(q.cx+q.road+18*q.p,q.y);x.scale(q.p,q.p);x.fillStyle='#e9efdf';x.fillRect(-18,-35,38,25);x.fillStyle='#16251b';x.font='900 12px Arial';x.textAlign='center';x.fillText(nextSign+' KM',1,-18);x.fillStyle='#ddd';x.fillRect(-2,-10,4,25);x.restore()}}
    }
    function car(lane,z,color,angle=0,wobble=0){let q=point(z),s=.62*q.p+(.35),cx=q.cx+lane*q.road*.72,cy=q.y;x.save();x.translate(cx,cy);x.rotate(angle+(wobble?Math.sin(t*18)*.12:0));x.shadowColor='#000';x.shadowBlur=10;x.fillStyle='#111';x.fillRect(-13*s,-24*s,26*s,48*s);x.fillStyle=color;x.beginPath();x.roundRect(-11*s,-23*s,22*s,45*s,5*s);x.fill();x.fillStyle='#b8e8ff';x.fillRect(-8*s,-10*s,16*s,11*s);x.fillStyle='#08100c';x.fillRect(-7*s,7*s,14*s,8*s);x.fillStyle='#fff6c7';x.fillRect(-9*s,-21*s,5*s,3*s);x.fillRect(4*s,-21*s,5*s,3*s);x.restore()}
    function draw(){x.save();if(shake)x.translate((Math.random()-.5)*12*shake,(Math.random()-.5)*12*shake);road();let rz=H*.22-rival.lead*3.5;if(rz>0&&rz<H*.94)car(rival.lane,rz,'#ff563d',0,rival.wobble);car(player.lane,H*.22,'#d4ff3f',player.spin,player.wobble);for(const p of particles){x.globalAlpha=p.life*3;x.fillStyle='#ffd45c';x.fillRect(p.x,p.y,3,3)}x.restore()}
    function loop(n){let dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
  })();
  </script>
</body></html>
