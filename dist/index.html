<!doctype html>
<html lang="ja">
<head>

  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
  <meta name="theme-color" content="#07150f">
  <title>WINDING 10K — Forest Duel</title>
  <style>

<body>
  <canvas id="game"></canvas>
  <div class="hud">
    <div class="top"><div class="brand">WINDING 10K<br>FOREST DUEL</div><div class="counter"><div class="distance"><span id="km">0.00</span><small> / 10</small></div><div class="unit">KILOMETERS</div><div class="progress"><i id="bar"></i></div></div></div>
    <div class="bottom"><div class="speed"><strong id="speed">0</strong><span>KM/H</span></div><div class="place"><b id="place">2ND</b> POSITION</div></div>
  </div>
  <div class="control-deck" aria-hidden="true"></div>
  <div class="steering" aria-label="親指操作パッド">
    <button id="pad" class="pad" aria-label="上下で加速とブレーキ、左右でステアリング">
      <span class="dir up">↑<small>ACCEL</small></span><span class="dir down">↓<small>BRAKE</small></span>
      <span class="dir left">←<small>LEFT</small></span><span class="dir right">→<small>RIGHT</small></span>
      <i id="knob" class="knob"></i><b class="pad-note">SLIDE WITH ONE THUMB</b>
    </button>
  </div>
  <div id="message" class="message"><div class="card"><div class="eyebrow">ONE FINGER. TEN KILOMETERS.</div><h1>FOREST<br><em>DUEL</em></h1><p>下のパッドを親指でスライド。上で加速、下でブレーキ、左右でステアリング。</p><button id="start" class="start">START RACE</button><span class="hint">斜めに滑らせれば、加速しながら曲がれます</span></div></div>
  <div id="callout" class="callout">1 KM</div>
  <script>
  (()=>{

    const kmEl=document.querySelector('#km'),spEl=document.querySelector('#speed'),bar=document.querySelector('#bar'),placeEl=document.querySelector('#place'),msg=document.querySelector('#message'),callout=document.querySelector('#callout');
    let player={lane:.52,vx:0,spin:0,wobble:0}, rival={lane:-.22,vx:0,lead:38,speed:164,wobble:0,coupled:false,coupleGap:13.4},target=.52,throttle=0,particles=[],hitCooldown=0,startTimers=[],crashed=false;

    const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

    pad.addEventListener('pointerdown',padDown);pad.addEventListener('pointermove',e=>{if(pad.hasPointerCapture?.(e.pointerId))movePad(e)});pad.addEventListener('pointerup',padUp);pad.addEventListener('pointercancel',padUp);pad.addEventListener('lostpointercapture',padUp);
    function spark(px,py,n=8){for(let i=0;i<n;i++)particles.push({x:px,y:py,vx:(Math.random()-.5)*170,vy:-Math.random()*130-30,life:.25+Math.random()*.35})}
    function initAudio(){if(audioCtx){audioCtx.resume();return}audioCtx=new (window.AudioContext||window.webkitAudioContext)();let master=audioCtx.createGain();master.gain.value=.7;master.connect(audioCtx.destination);engineGain=audioCtx.createGain();engineGain.gain.value=0;let filter=audioCtx.createBiquadFilter();filter.type='lowpass';filter.frequency.value=520;engineOsc=audioCtx.createOscillator();engineOsc.type='sawtooth';engineSub=audioCtx.createOscillator();engineSub.type='square';let subGain=audioCtx.createGain();subGain.gain.value=.28;engineOsc.connect(filter);engineSub.connect(subGain).connect(filter);filter.connect(engineGain).connect(master);engineOsc.start();engineSub.start();let buf=audioCtx.createBuffer(1,audioCtx.sampleRate*2,audioCtx.sampleRate),d=buf.getChannelData(0);for(let i=0;i<d.length;i++)d[i]=(Math.random()*2-1)*(.5+Math.sin(i*.031)*.5);brakeNoise=audioCtx.createBufferSource();brakeNoise.buffer=buf;brakeNoise.loop=true;let bf=audioCtx.createBiquadFilter();bf.type='bandpass';bf.frequency.value=240;bf.Q.value=.7;brakeGain=audioCtx.createGain();brakeGain.gain.value=0;brakeNoise.connect(bf).connect(brakeGain).connect(master);brakeNoise.start()}

    function updateAudio(){if(!audioCtx)return;let now=audioCtx.currentTime,load=speed/250;engineOsc.frequency.setTargetAtTime(48+speed*.48,now,.06);engineSub.frequency.setTargetAtTime(24+speed*.24,now,.06);engineGain.gain.setTargetAtTime(running?.035+load*.07:0,now,.08);brakeGain.gain.setTargetAtTime(running&&throttle<-.08?.05+(-throttle)*load*.16:0,now,.04)}
    function reset(){startTimers.forEach(clearTimeout);startTimers=[];initAudio();t=dist=0;speed=0;nextSign=1;target=.52;throttle=0;hitCooldown=0;crashed=false;player={lane:.52,vx:0,spin:0,wobble:0};rival={lane:-.52,vx:0,lead:0,speed:190,wobble:0,coupled:false,coupleGap:13.4};particles=[];running=false;msg.classList.add('hidden');['3','2','1','GO!'].forEach((label,i)=>startTimers.push(setTimeout(()=>{callout.textContent=label;callout.classList.add('show');beep(i===3?920:700,i===3?.55:.13,i===3?.2:.14);if(i===3)running=true;setTimeout(()=>callout.classList.remove('show'),i===3?650:420)},i*600)))}
    document.querySelector('#start').onclick=reset;
    function crash(side){crashed=true;running=false;hitSound(true);speed=0;player.lane=side*1.48;player.spin=side*Math.PI*.6;shake=.8;spark(W/2+side*W*.16,trackBottom()*.62,30);setTimeout(()=>{msg.classList.remove('hidden');msg.querySelector('.eyebrow').textContent='HIGH-SPEED IMPACT';msg.querySelector('h1').innerHTML='ROAD<br><em>OUT</em>';msg.querySelector('p').textContent='ヘアピンでは減速が必要です。ブレーキを使ってもう一度挑戦しよう。';msg.querySelector('button').textContent='TRY AGAIN'},450)}
    function carPose(lane,z){let q=point(z),ahead=point(z+8),angle=Math.atan2(ahead.cx-q.cx,-(ahead.y-q.y)),p=roadOffset(q,lane*q.road*.72);return{x:p.x,y:p.y,angle}}
    function collide(dt){let edge=1.08;if(Math.abs(player.lane)>edge){let impact=Math.abs(player.vx)*85+Math.abs(target-player.lane)*35,side=Math.sign(player.lane);if(speed>175&&impact>=24){crash(side);return}if(hitCooldown<=0){hitSound(impact>=30);hitCooldown=.28}if(impact<30){player.lane=side*edge;player.vx*=-.18;spark(W/2+player.lane*W*.25,trackBottom()*.66,6)}else{player.lane=side*edge*.92;player.vx*=-.6;player.spin=Math.sign(player.vx||1)*Math.PI*4;player.wobble=2.1;speed*=.62;shake=.4;spark(W/2+player.lane*W*.25,trackBottom()*.66,18)}}
      let gap=rival.lead,pz=trackBottom()*.34,pp=carPose(player.lane,pz),rp=carPose(rival.lane,pz+gap*3.5),sx=rp.x-pp.x,sy=rp.y-pp.y,fx=Math.sin(pp.angle),fy=-Math.cos(pp.angle),longGap=Math.abs(sx*fx+sy*fy),sideGap=Math.abs(sx*(-fy)+sy*fx),touching=longGap<48&&sideGap<26;if(touching){if(!rival.coupled&&hitCooldown<=0){hitSound(true);hitCooldown=.34;shake=.1}rival.coupled=true;rival.coupleGap=gap>=0?13.4:-13.4;rival.lead=rival.coupleGap;let joined=Math.max(130,speed*.68+rival.speed*.32);speed=rival.speed=joined;player.vx*=.72;rival.vx*=.72}}
    function update(dt){if(!running){updateAudio();return}t+=dt;hitCooldown=Math.max(0,hitCooldown-dt);let followLane=Math.abs(player.lane-rival.lane)<.58,closingKph=Math.max(0,speed-rival.speed),closingMps=closingKph/3.6,clearance=Math.max(.1,rival.lead-15),ttc=clearance/Math.max(.1,closingMps),following=rival.lead>0&&rival.lead<42&&followLane,autoBrake=following&&closingKph>1?clamp((2.4-ttc)/1.9,0,1):0,desired=throttle>.08?150+throttle*100:throttle<-.08?150+throttle*105:Math.max(0,speed-80),response=throttle<-.08?1.9:throttle>.08?1.05:.88,previousSpeed=speed;if(autoBrake>0){desired=Math.min(desired,Math.max(125,rival.speed-2));response=Math.max(response,1.15+autoBrake*1.65)}speed+=(desired-speed)*dt*response;if(autoBrake>0)speed=Math.max(speed,previousSpeed-(18+autoBrake*24)*dt);if(following&&rival.lead<18)rival.lead=Math.max(rival.lead,15);speed=clamp(speed,0,250);dist+=speed*dt/3600;

      if(dist>=10){dist=10;running=false;setTimeout(()=>{msg.classList.remove('hidden');msg.querySelector('.eyebrow').textContent=rival.lead<0?'VICTORY — 1ST PLACE':'FINISH — 2ND PLACE';msg.querySelector('h1').innerHTML=rival.lead<0?'YOU<br><em>WIN</em>':'NICE<br><em>CHASE</em>';msg.querySelector('p').textContent='10km完走。もう一度、最速のラインに挑戦しよう。';msg.querySelector('button').textContent='RACE AGAIN'},500)}

    }
    function drawTree(xx,yy,p,i){let s=(10+(i*7)%10)*p;x.save();x.translate(xx,yy);if(speed>125&&p>.72){let streak=(speed-125)*.13*p;x.strokeStyle='#b5d9bd18';x.lineWidth=Math.max(1,2.4*p);x.beginPath();x.moveTo(0,-4*p);x.lineTo(0,-streak-10*p);x.stroke()}x.fillStyle='#04130c66';x.beginPath();x.ellipse(5*p,7*p,s*1.15,s*.48,-.35,0,7);x.fill();x.fillStyle='#59412b';x.fillRect(-2*p,0,4*p,12*p);if(i%3===0){let colors=['#163f28','#1d5330','#2d6840'];for(let k=0;k<3;k++){x.fillStyle=colors[(i+k)%3];x.beginPath();x.moveTo(0,-s*(1.45-k*.25));x.lineTo(-s*(.7-k*.08),s*(-.18+k*.28));x.lineTo(s*(.7-k*.08),s*(-.18+k*.28));x.closePath();x.fill()}}else{let colors=['#153d25','#255936','#337047','#1b4b2d'];for(let k=0;k<5;k++){let a=(k/5)*Math.PI*2+(i%4)*.3,r=s*.42;x.fillStyle=colors[(i+k)%colors.length];x.beginPath();x.arc(Math.cos(a)*r*.7,Math.sin(a)*r*.45-s*.45,s*(.46+(k%2)*.08),0,7);x.fill()}x.fillStyle='#3f7950';x.beginPath();x.arc(-s*.18,-s*.72,s*.32,0,7);x.fill()}x.restore()}
    function road(){let tb=trackBottom(),visualTravel=dist*10000*2.4;x.fillStyle='#0b2417';x.fillRect(0,0,W,H);for(let y=0;y<tb;y+=30){x.fillStyle=((y/30|0)%2)?'#10301e':'#0d291a';x.fillRect(0,y,W,31)}let pts=[];for(let y=0;y<=tb+6;y+=6)pts.push(point(tb-y));function ribbon(extra,color){x.beginPath();for(let i=0;i<pts.length;i++){let q=pts[i],p=roadOffset(q,-q.road-extra*q.p);i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)}for(let i=pts.length-1;i>=0;i--){let q=pts[i],p=roadOffset(q,q.road+extra*q.p);x.lineTo(p.x,p.y)}x.closePath();x.fillStyle=color;x.fill()}ribbon(8,'#486052');ribbon(0,'#303633');x.lineJoin='round';x.lineCap='round';for(const side of[-1,1]){x.beginPath();for(let i=0;i<pts.length;i++){let q=pts[i],p=roadOffset(q,side*(q.road-2*q.p));i?x.lineTo(p.x,p.y):x.moveTo(p.x,p.y)}x.strokeStyle='#f4f0df';x.lineWidth=2;x.stroke()}let dashStep=36,dashLength=17,dashShift=(visualTravel/3.5)%dashStep;x.beginPath();for(let z=-dashShift;z<tb+dashLength;z+=dashStep){let a=point(z),b=point(z+dashLength);x.moveTo(a.cx,a.y);x.lineTo(b.cx,b.y)}x.strokeStyle='#f4f0df';x.lineWidth=2;x.stroke();
      let trees=[],treeCycle=(visualTravel/1150)%1;for(let i=0;i<34;i++){let phase=(i/34+treeCycle)%1,progress=Math.pow(phase,1.48),z=tb*(1-progress),q=point(z),scale=.42+progress*1.02,side=i%2?1:-1,setback=18+((i*37)%62)*(.5+.5*progress),p=roadOffset(q,side*(q.road+setback));trees.push({x:p.x,y:p.y,scale,i})}trees.sort((a,b)=>a.y-b.y);for(const tree of trees)drawTree(tree.x,tree.y,tree.scale,tree.i)
      if(nextSign<=10){let signZ=((nextSign-dist)*10000/3.5)%tb;if(signZ>30&&signZ<tb){let q=point(signZ),p=roadOffset(q,q.road+18*q.p);x.save();x.translate(p.x,p.y);x.scale(q.p,q.p);x.fillStyle='#e9efdf';x.fillRect(-18,-35,38,25);x.fillStyle='#16251b';x.font='900 12px Arial';x.textAlign='center';x.fillText(nextSign+' KM',1,-18);x.fillStyle='#ddd';x.fillRect(-2,-10,4,25);x.restore()}}
    }
    function car(lane,z,color,angle=0,wobble=0){let p=carPose(lane,z),s=.92;x.save();x.translate(p.x,p.y);x.rotate(p.angle+angle+(wobble?Math.sin(t*18)*.12:0));x.shadowColor='#000';x.shadowBlur=10;x.fillStyle='#111';x.fillRect(-13*s,-24*s,26*s,48*s);x.fillStyle=color;x.beginPath();x.roundRect(-11*s,-23*s,22*s,45*s,5*s);x.fill();x.fillStyle='#b8e8ff';x.fillRect(-8*s,-10*s,16*s,11*s);x.fillStyle='#08100c';x.fillRect(-7*s,7*s,14*s,8*s);x.fillStyle='#fff6c7';x.fillRect(-9*s,-21*s,5*s,3*s);x.fillRect(4*s,-21*s,5*s,3*s);x.restore()}
    function draw(){x.save();if(shake)x.translate((Math.random()-.5)*12*shake,(Math.random()-.5)*12*shake);road();let pz=trackBottom()*.34,rz=pz+rival.lead*3.5;if(rz>0&&rz<trackBottom()*.94)car(rival.lane,rz,'#ff563d',0,rival.wobble);car(player.lane,pz,'#d4ff3f',player.spin,player.wobble);for(const p of particles){x.globalAlpha=p.life*3;x.fillStyle='#ffd45c';x.fillRect(p.x,p.y,3,3)}x.restore()}
    function loop(n){let dt=Math.min(.033,(n-last)/1000||0);last=n;update(dt);draw();requestAnimationFrame(loop)}requestAnimationFrame(loop);
  })();
